# Affine-equivariant keypoint pretraining example.
# Run from the repository root. Settings follow the final-model pretraining
# recipe and are resource-intensive; reduce epochs/sample counts for a trial.
train_path: data/train
output_path: outputs/pretrain
model_name: pretrain.pth

pretrain: true
use_checkpoint: null
init_cluster_after_pretrain: false

epochs: 500
# Global batch size. With four torchrun processes this is one subject sample per GPU.
batch_size: 4
learning_rate: 0.001
gpu: 0
use_amp: true

feat_len: 1024
num_keypoints: 256
num_clusters: 800
cluster_temperature: 1.0
keypoint_temperature: 0.6
keypoint_head_append_coords: true

nb_points: 14
num_samples: 16000
min_length: 30
max_length: 300
recenter: false
dataset_load_workers: 8
dataloader_workers: 8
dataloader_prefetch_factor: 4

pretrain_registration_weight: 1.0
pretrain_metric_weight: 0.0005
pretrain_embedding_consistency_weight: 0.02
embedding_metric_delta: 1.0
keypoint_regularization_weight: 0.02
